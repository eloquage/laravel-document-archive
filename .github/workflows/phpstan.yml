name: PHPStan

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Clone path dependencies
        shell: bash
        run: |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/miguelenes/laravel-vector-search.git" "$(dirname "$GITHUB_WORKSPACE")/laravel-vector-search"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
